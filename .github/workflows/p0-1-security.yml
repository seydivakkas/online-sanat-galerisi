name: P0.1 Security Gate

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/p0-1-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify frozen lockfile install
        working-directory: backend
        run: npm ci --ignore-scripts=false --no-fund --no-audit
      - name: Security smoke checks (temporary SQLite)
        working-directory: backend
        run: npm run test:security
      - name: Payment status and audit integration tests
        working-directory: backend
        run: npm run test:payments
      - name: P1 booking and inventory integrity tests
        working-directory: backend
        run: npm run test:integrity
      - name: P1.3 administrator module integration tests
        working-directory: backend
        run: npm run test:admin
      - name: Scan production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci --no-fund --no-audit
      - name: Compile React frontend
        working-directory: frontend
        run: npm run build
