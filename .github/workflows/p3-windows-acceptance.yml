name: P3 Windows Local Acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deployment/**'
      - '.github/workflows/p3-windows-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-local-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and compile offline-capable Windows package
        shell: pwsh
        run: |
          ./deployment/Install-Windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows install/build failed" }
      - name: Check PowerShell scripts and migration on Windows
        shell: pwsh
        run: |
          $files = @(
            'deployment/Install-Windows.ps1',
            'deployment/Start-Local.ps1',
            'deployment/Migrate-Database.ps1'
          )
          foreach ($name in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $name).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "Syntax errors in $name" }
          }
          cd backend
          npm run test:migrations
          if ($LASTEXITCODE -ne 0) { throw "Migration tests failed" }
      - name: Start Windows gallery and test same-origin site
        shell: pwsh
        run: |
          $script = (Resolve-Path ./deployment/Start-Local.ps1).Path
          $out = Join-Path $env:RUNNER_TEMP 'gallery.stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'gallery.stderr.log'
          $p = Start-Process -FilePath 'powershell.exe' -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File "' + $script + '"') -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:3001/api/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              if (Test-Path $err) { Get-Content $err -Tail 50 }
              throw "Windows local API did not start"
            }
            $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3001/' -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -ne 200 -or $response.Content -notmatch '<div id="root"') {
              throw 'React same-origin root was not served'
            }
            $artworks = Invoke-WebRequest -Uri 'http://127.0.0.1:3001/api/artworks' -UseBasicParsing -TimeoutSec 10
            if ($artworks.StatusCode -ne 200) { throw 'Catalog API failed' }
            $dataRoot = Join-Path $env:LOCALAPPDATA 'ArtGallery'
            if (-not (Test-Path (Join-Path $dataRoot 'art-gallery.sqlite'))) {
              throw 'Persistent Windows SQLite database not created'
            }
            $secret = Get-Content (Join-Path $dataRoot 'jwt-secret.txt') -Raw
            if ($secret.Trim().Length -lt 32) { throw 'Secure JWT secret not persisted' }
            Write-Host 'Windows local API, gallery page, SQLite and secret smoke acceptance: PASS'
          } finally {
            try { taskkill.exe /T /F /PID $p.Id | Out-Null } catch { }
          }
